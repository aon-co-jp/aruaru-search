<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aruaru-search</title>
<style>
:root{--bg:#fff;--fg:#1c2330;--muted:#5b6474;--line:#d9dee7;--accent:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--fg:#e6e9ef;--muted:#9aa4b5;--line:#2b3340;--accent:#6ea0ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0}
form{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input{flex:1 1 260px}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
.r{padding:10px 0;border-bottom:1px solid var(--line)}
.r a{color:var(--accent);font-size:17px}
.u,.e{color:var(--muted);font-size:13px;word-break:break-all}
.err{color:#c0392b}
</style></head><body><main>
<h1>aruaru-search <span class="e">APIキー不要・世界約130言語 / key-free, ~130 languages</span></h1>

sk</option><option value="rm">ロマンシュ語 — Rumantsch</option><option value="co">コルシカ語 — Corsu</option><option value="eo">エスペラント — Esperanto</option><option value="la">ラテン語 — Latina</option><option value="yi">イディッシュ語 — ייִדיש</option><option value="sw">スワヒリ語 — Kiswahili</option><option value="am">アムハラ語 — አማርኛ</option><option value="ti">ティグリニャ語 — ትግርኛ</option><option value="om">オロモ語 — Afaan Oromoo</option><option value="so">ソマリ語 — Soomaali</option><option value="ha">ハウサ語 — Hausa</option><option value="yo">ヨルバ語 — Yorùbá</option><option value="ig">イボ語 — Igbo</option><option value="ff">フラ語 — Fulfulde</option><option value="wo">ウォロフ語 — Wolof</option><option value="ak">アカン語 — Akan</option><option value="ee">エウェ語 — Eʋegbe</option><option value="ln">リンガラ語 — Lingála</option><option value="kg">コンゴ語 — Kikongo</option><option value="rw">キニヤルワンダ語 — Kinyarwanda</option><option value="rn">キルンディ語 — Ikirundi</option><option value="lg">ガンダ語 — Luganda</option><option value="mg">マダガスカル語 — Malagasy</option><option value="ny">チェワ語 — Chichewa</option><option value="sn">ショナ語 — chiShona</option><option value="zu">ズールー語 — isiZulu</option><option value="xh">コサ語 — isiXhosa</option><option value="af">アフリカーンス語 — Afrikaans</option><option value="st">ソト語 — Sesotho</option><option value="tn">ツワナ語 — Setswana</option><option value="ht">ハイチ・クレオール語 — Kreyòl ayisyen</option><option value="qu">ケチュア語 — Runasimi</option><option value="ay">アイマラ語 — Aymar aru</option><option value="gn">グアラニー語 — Avañeʼẽ</option><option value="mi">マオリ語 — Te Reo Māori</option><option value="sm">サモア語 — Gagana Sāmoa</option><option value="to">トンガ語 — Lea faka-Tonga</option><option value="fj">フィジー語 — Na Vosa Vakaviti</option><option value="haw">ハワイ語 — ʻŌlelo Hawaiʻi</option><option value="tpi">トク・ピシン — Tok Pisin</option><option value="tet">テトゥン語 — Tetun</option><option value="dz">ゾンカ語 — རྫོང་ཁ</option></select><button>検索 / Search</button></form>
<div id="out"></div>
<p class="e">結果は Bing・Brave Search・DuckDuckGo・Yahoo! JAPAN などの公開ページを統合したものです。<a href="https://github.com/aon-co-jp/aruaru-search">GitHub</a></p>
<script>
const $=id=>document.getElementById(id);
const nav=(navigator.language||'ja').replace('_','-');
const sel=$('hl'); const base=nav.split('-')[0];
const pick=[...sel.options].find(o=>o.value.toLowerCase()===nav.toLowerCase())||[...sel.options].find(o=>o.value===base);
sel.value=pick?pick.value:'ja';
$('f').onsubmit=async e=>{
  e.preventDefault(); const out=$('out'); out.textContent='…';
  try{
    const r=await fetch('/v1/search?'+new URLSearchParams({q:$('q').value,hl:sel.value,n:15}));
    const d=await r.json(); out.textContent='';
    if(d.error){const p=document.createElement('p');p.className='err';p.textContent=d.error;out.append(p);return}
    for(const x of d.results){
      const div=document.createElement('div');div.className='r';
      const a=document.createElement('a');a.href=x.link;a.rel='noopener noreferrer';a.target='_blank';a.textContent=x.title;
      const u=document.createElement('div');u.className='u';u.textContent=x.link;
      const s=document.createElement('div');s.textContent=x.snippet;
      const en=document.createElement('div');en.className='e';en.textContent=x.engines.join(' · ');
      div.append(a,u,s,en);out.append(div);
    }
  }catch(err){out.textContent=String(err)}
};
</script></main></body></html>
